name: Milk Pop protected staging integration

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: 'Type the exact protected staging Supabase project ref'
        required: true
        type: string
      confirm_stateful_probe:
        description: 'Type RUN STAGING INTEGRATION — this test creates temporary records and an immutable audit entry'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: milkpop-staging-mutation
  cancel-in-progress: false

jobs:
  authenticated-integration:
    name: Authenticated owner, manager and staff journey
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.2
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.84.2
      - name: Install the exact PostgreSQL 17 client
        run: bash scripts/install-postgresql-17.sh client
      - name: Confirm the protected staging target and stateful test
        env:
          EXPECTED_PROJECT_REF: ${{ vars.MP_STAGING_SUPABASE_PROJECT_REF }}
          CONFIRMED_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          CONFIRMED_STATEFUL_PROBE: ${{ inputs.confirm_stateful_probe }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_DISPOSABLE: ${{ vars.MP_STAGING_DISPOSABLE }}
        run: |
          set -euo pipefail
          [ -n "$EXPECTED_PROJECT_REF" ] || { echo 'MP_STAGING_SUPABASE_PROJECT_REF is not configured'; exit 1; }
          [ "$STAGING_DISPOSABLE" = 'true' ] || { echo 'MP_STAGING_DISPOSABLE must be true for this stateful workflow'; exit 1; }
          [ "$CONFIRMED_PROJECT_REF" = "$EXPECTED_PROJECT_REF" ] || { echo 'staging project ref confirmation mismatch'; exit 1; }
          [ "$CONFIRMED_STATEFUL_PROBE" = 'RUN STAGING INTEGRATION' ] || { echo 'stateful staging confirmation phrase mismatch'; exit 1; }
          case "$STAGING_SUPABASE_URL" in
            "https://$EXPECTED_PROJECT_REF.supabase.co"|"https://$EXPECTED_PROJECT_REF.supabase.co/") ;;
            *) echo 'STAGING_SUPABASE_URL does not match the protected staging project ref'; exit 1 ;;
          esac
      - name: Install the exact locked dependencies
        run: npm ci
      - name: Apply the exact source migration ledger to disposable staging
        env:
          MP_SUPABASE_PROJECT_REF: ${{ vars.MP_STAGING_SUPABASE_PROJECT_REF }}
          MP_CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          MP_COMMISSION_CONFIRMATION: APPLY MIGRATIONS ${{ vars.MP_STAGING_SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-integration
          bash scripts/commission-database.sh upgrade 2>&1 | tee artifacts/staging-integration/database-upgrade.log
          echo 'STAGING_DATABASE_SOURCE_LEDGER_PASS' | tee -a artifacts/staging-integration/database-upgrade.log

      - name: Deploy the exact source-controlled public and staff functions to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MP_SUPABASE_PROJECT_REF: ${{ vars.MP_STAGING_SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          bash launch/deploy-public-functions.sh 2>&1 | tee artifacts/staging-integration/function-deploy.log
          echo 'STAGING_FUNCTION_SOURCE_DEPLOY_PASS' | tee -a artifacts/staging-integration/function-deploy.log

      - name: Verify the deployed staging database and low-role API
        env:
          MP_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
          MP_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          MP_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          MP_PROBE_EMAIL: ${{ secrets.STAGING_PROBE_USER_EMAIL }}
          MP_PROBE_PASSWORD: ${{ secrets.STAGING_PROBE_USER_PASSWORD }}
          MP_MANIFEST: release-manifest.json
        run: node scripts/deployed-acceptance-probe.mjs 2>&1 | tee artifacts/staging-integration/deployed-acceptance.log

      - name: Run the authenticated staging integration journey
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          MP_OWNER_EMAIL: ${{ secrets.STAGING_OWNER_EMAIL }}
          MP_OWNER_PASSWORD: ${{ secrets.STAGING_OWNER_PASSWORD }}
          MP_OWNER_TOTP_SECRET: ${{ secrets.STAGING_OWNER_TOTP_SECRET }}
          MP_MGR_A_EMAIL: ${{ secrets.STAGING_MANAGER_A_EMAIL }}
          MP_MGR_A_PASSWORD: ${{ secrets.STAGING_MANAGER_A_PASSWORD }}
          MP_MGR_A_TOTP_SECRET: ${{ secrets.STAGING_MANAGER_A_TOTP_SECRET }}
          MP_STAFF_A_EMAIL: ${{ secrets.STAGING_STAFF_A_EMAIL }}
          MP_STAFF_A_PASSWORD: ${{ secrets.STAGING_STAFF_A_PASSWORD }}
          MP_STAFF_A_TOTP_SECRET: ${{ secrets.STAGING_STAFF_A_TOTP_SECRET }}
          MP_MGR_B_EMAIL: ${{ secrets.STAGING_MANAGER_B_EMAIL }}
          MP_MGR_B_PASSWORD: ${{ secrets.STAGING_MANAGER_B_PASSWORD }}
          MP_MGR_B_TOTP_SECRET: ${{ secrets.STAGING_MANAGER_B_TOTP_SECRET }}
          MP_STAFF_B_EMAIL: ${{ secrets.STAGING_STAFF_B_EMAIL }}
          MP_STAFF_B_PASSWORD: ${{ secrets.STAGING_STAFF_B_PASSWORD }}
          MP_STAFF_B_TOTP_SECRET: ${{ secrets.STAGING_STAFF_B_TOTP_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-integration
          npm run test:staging 2>&1 | tee artifacts/staging-integration/staging-integration.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: staging-integration-${{ github.run_number }}
          path: artifacts/staging-integration/
          if-no-files-found: error
